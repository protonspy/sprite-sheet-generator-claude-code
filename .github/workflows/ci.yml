name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows is in the matrix because that is where this is developed, and because the
    # things most likely to break per-platform here — paths, CRLF, the wasmtime runtime —
    # only break there.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Test
        run: uv run pytest

  artifacts:
    # scc checks the shape of the spec/plan/docs artifacts. Exit 2 means it ran and found
    # something, which is a failure here — not a crash.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: scc validate
        run: npx --yes @protonspy/scc validate

  build:
    # The wheel is the deliverable, so a PR that breaks the build should never look green
    # just because the suite passed. `uv build` is the same command publish uses; this only
    # fails, it does not upload.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build wheels and sdist
        run: uv build
      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
