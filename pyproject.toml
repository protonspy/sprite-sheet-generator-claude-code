[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sprite-sheet-generator-claude-code"
version = "0.3.0"
description = "Turn AI-generated art into game-ready 2D assets"
readme = "README.md"
authors = [{ name = "Mateus Andrade" }]
keywords = ["sprites", "2d", "pixel-art", "game-assets", "spritesheet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
# 3.12, not 3.11: numpy's own type stubs use `type` statements, so a 3.11 floor is one
# this project cannot type-check. See docs/adr/0001-python-and-uv.md.
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "pillow>=10.3",
    "opencv-python-headless>=4.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "wasmtime>=21.0",
    # Pinned to 1.x: the submit/get_handle/status/result/cancel surface job-store is built
    # on. See docs/adr/0006-job-store-rides-the-fal-client-handle-surface.md.
    "fal-client>=1.0,<2",
]

# The suite must pass without these installed; tests that need them skip with a reason.
[project.optional-dependencies]
cv = ["onnxruntime>=1.18", "rembg>=2.0"]
cv-gpu = ["onnxruntime-gpu>=1.18", "rembg>=2.0"]

[project.urls]
Homepage = "https://github.com/protonspy/sprite-sheet-generator-claude-code"
Repository = "https://github.com/protonspy/sprite-sheet-generator-claude-code"
Issues = "https://github.com/protonspy/sprite-sheet-generator-claude-code/issues"

[project.scripts]
ssc = "ssc.cli.app:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "types-PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ssc"]

# The vendored module is not source, so it does not live under `src/` — but `ssc tool snap`
# is useless without it, so it has to ship. `snapper.module_path` looks here first and in
# the checkout's own `vendor/` second. The licence travels with the binary: it is not ours.
[tool.hatch.build.targets.wheel.force-include]
"vendor/pixel-snapper.wasm" = "ssc/vendor/pixel-snapper.wasm"
"vendor/LICENSE" = "ssc/vendor/LICENSE"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
# meta.json is the public contract, so its models are pydantic; the plugin is what
# lets mypy see the fields those models generate.
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
